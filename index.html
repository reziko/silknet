<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silknet როუთერის პაროლი</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #111111;
            --text-muted: #666666;
            --border-color: #e0e0e0;
            --error-color: #e53e3e;
            --success-color: #38a169;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 500;
            text-align: center;
            letter-spacing: -0.02em;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 1rem;
            font-size: 1rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            text-align: center;
        }

        input:focus {
            border-color: var(--text-main);
        }

        input::placeholder {
            color: #a0a0a0;
            letter-spacing: normal;
            text-transform: none;
        }

        button {
            width: 100%;
            padding: 1rem;
            background-color: var(--text-main);
            color: var(--bg-color);
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: #333333;
        }
        
        button:active {
            transform: scale(0.98);
        }

        .result-container {
            min-height: 4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
        }

        .password-display {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            cursor: pointer;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            transition: background-color 0.2s;
        }

        .password-display:hover {
            background-color: #f5f5f5;
        }

        .message {
            font-size: 0.875rem;
            margin-top: 0.5rem;
            min-height: 1.2rem;
        }

        .error {
            color: var(--error-color);
        }

        .success {
            color: var(--success-color);
        }

        .hint {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
<meta name="google-site-verification" content="8_Dtu6e9qjq5Z7Xj4U6V961oEZ2r37OE2XNt61qcdBw" />
</head>
<body>

    <div class="container">
        <h1>პაროლის გასაგებად საჭიროა მხოლოდ როუთერის MAC მისამართი ხოლო USERNAME არის "Silknet"</h1>
        
        <div class="input-group">
            <label for="macInput">შეიყვანეთ როუთერის MAC მისამართი</label>
            <input type="text" id="macInput" placeholder="e.g. 28:5B:0C:95:64:00" autocomplete="off" spellcheck="false">
        </div>

        <button id="generateBtn">პაროლის გაგება</button>

        <div class="result-container">
            <div id="passwordResult" class="password-display" style="display: none;" title="Click to copy"></div>
            <div id="statusMessage" class="message"></div>
        </div>

        <p class="hint">ჩემი მაილი rezikolive@gmail.com</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const macInput = document.getElementById('macInput');
            const generateBtn = document.getElementById('generateBtn');
            const passwordResult = document.getElementById('passwordResult');
            const statusMessage = document.getElementById('statusMessage');

            function calculatePassword() {
                // Reset UI
                passwordResult.style.display = 'none';
                passwordResult.textContent = '';
                statusMessage.textContent = '';
                statusMessage.className = 'message';

                const rawMac = macInput.value;
                
                // Clean the MAC address
                const cleanMac = rawMac.replace(/[^A-Fa-f0-9]/g, '').toUpperCase();

                if (cleanMac.length !== 12) {
                    statusMessage.textContent = 'Invalid format. Must be 12 characters.';
                    statusMessage.className = 'message error';
                    return;
                }

                // Extract bytes
                const byte5 = cleanMac.substring(8, 10);
                const byte6 = cleanMac.substring(10, 12);

                // Get date logic
                const now = new Date();
                const monthStr = String(now.getMonth() + 1).padStart(2, '0');
                const reversedYear = String(now.getFullYear()).split('').reverse().join('');

                // Construct password
                const password = `${byte5}!${monthStr}${byte6}${reversedYear}`;

                // Display result
                passwordResult.textContent = password;
                passwordResult.style.display = 'block';
                statusMessage.textContent = 'Click password to copy';
                statusMessage.className = 'message hint';
            }

            generateBtn.addEventListener('click', calculatePassword);

            // Allow pressing Enter in the input field
            macInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    calculatePassword();
                }
            });

            // Click to copy functionality
            passwordResult.addEventListener('click', () => {
                const textToCopy = passwordResult.textContent;
                
                // Use fallback approach for wide compatibility (especially in iframes)
                const textArea = document.createElement("textarea");
                textArea.value = textToCopy;
                textArea.style.position = "fixed";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();

                try {
                    document.execCommand('copy');
                    statusMessage.textContent = 'Copied to clipboard!';
                    statusMessage.className = 'message success';
                    
                    // Reset message after 2 seconds
                    setTimeout(() => {
                        if (statusMessage.textContent === 'Copied to clipboard!') {
                            statusMessage.textContent = 'Click password to copy';
                            statusMessage.className = 'message hint';
                        }
                    }, 2000);
                } catch (err) {
                    statusMessage.textContent = 'Failed to copy';
                    statusMessage.className = 'message error';
                }
                
                document.body.removeChild(textArea);
            });
        });
    </script>
</body>
</html>
